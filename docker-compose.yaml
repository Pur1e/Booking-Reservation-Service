services:

  postgresql_user:
    container_name: ms_pg_sql_user
    image: postgres:16.3
    environment:
      POSTGRES_USER: qwe
      POSTGRES_PASSWORD: qwe
      PGDATA: /var/lib/data/postgres/user
    volumes:
      - postgres:/var/lib/data/postgres/user
    ports:
      - "1001:5432"
    networks:
      - microservices-net
    restart: unless-stopped

  postgresql_resource:
    container_name: ms_pg_sql_resource
    image: postgres:16.3
    environment:
      POSTGRES_USER: qwe
      POSTGRES_PASSWORD: qwe
      PGDATA: /var/lib/data/postgres/resource
    volumes:
      - postgres:/var/lib/data/postgres/resource
    ports:
      - "1002:5432"
    networks:
      - microservices-net
    restart: unless-stopped

  postgresql_booking:
    container_name: ms_pg_sql_booking
    image: postgres:16.3
    environment:
      POSTGRES_USER: qwe
      POSTGRES_PASSWORD: qwe
      PGDATA: /var/lib/data/postgres/booking
    volumes:
      - postgres:/var/lib/data/postgres/booking
    ports:
      - "1003:5432"
    networks:
      - microservices-net
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: ms_kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres: